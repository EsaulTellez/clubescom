name: escom-demo
x-app: &app
  build:
    context: .
    args:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6NDEwMjQ0NDgwMH0.ZbYc7gPX0b9PzxKUGJaaP8KIHvIiPDRrk60WbbOKl2Q
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${APP_PORT:-3001}
  environment: &app-env
    NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6NDEwMjQ0NDgwMH0.ZbYc7gPX0b9PzxKUGJaaP8KIHvIiPDRrk60WbbOKl2Q
    SUPABASE_SECRET_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.T9fJ_92ZQgprO9mvOERXx20dFg1Y9SuvCD6WWpG00uY
    NEXT_PUBLIC_SITE_URL: http://127.0.0.1:${APP_PORT:-3001}
    SITE_URL: ${SITE_URL:-http://127.0.0.1:${APP_PORT:-3001}}
    SHOW_DEMO_ACCOUNTS: "1"
    DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./docker/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./docker/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -h localhost']
      interval: 5s
      timeout: 5s
      retries: 30
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=fatal]
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:${MAIL_PORT:-54324}:8025
  realtime:
    image: supabase/realtime:v2.148.3
    hostname: realtime-dev
    depends_on:
      db: {condition: service_healthy}
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: escom-local-demo-jwt-secret-not-for-production-2026
      SECRET_KEY_BASE: escom-demo-secret-key-base-for-local-development-only-1234567890abcdef
      METRICS_JWT_SECRET: escom-local-demo-jwt-secret-not-for-production-2026
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://127.0.0.1:${APP_PORT:-3001}}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://127.0.0.1:${APP_PORT:-3001}}/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: escom-local-demo-jwt-secret-not-for-production-2026
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_MAILER_OTP_EXP: 900
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirma tu correo institucional de ESCOM
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Recupera tu acceso a ESCOM
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:${SUPABASE_PORT:-54321}/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway:${SUPABASE_PORT:-54321}/templates/recovery.html
      GOTRUE_SMTP_ADMIN_EMAIL: demo@example.com
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: ESCOM
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 30
  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: escom-local-demo-jwt-secret-not-for-production-2026
      PGRST_DB_USE_LEGACY_GUCS: 'false'
  storage:
    image: supabase/storage-api:v1.89.12
    depends_on:
      db: {condition: service_healthy}
      rest: {condition: service_started}
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6NDEwMjQ0NDgwMH0.ZbYc7gPX0b9PzxKUGJaaP8KIHvIiPDRrk60WbbOKl2Q
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjo0MTAyNDQ0ODAwfQ.T9fJ_92ZQgprO9mvOERXx20dFg1Y9SuvCD6WWpG00uY
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: escom-local-demo-jwt-secret-not-for-production-2026
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      STORAGE_PUBLIC_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: local
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage:/var/lib/storage
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://127.0.0.1:5000/status']
      interval: 5s
      timeout: 5s
      retries: 30
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth: {condition: service_healthy}
      rest: {condition: service_started}
      storage: {condition: service_healthy}
      realtime: {condition: service_started}
    environment:
      SUPABASE_PORT: ${SUPABASE_PORT:-54321}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./supabase/templates:/usr/share/nginx/html/templates:ro
    ports:
      - 127.0.0.1:${SUPABASE_PORT:-54321}:${SUPABASE_PORT:-54321}
      - 127.0.0.1:${APP_PORT:-3001}:3001
  init:
    <<: *app
    network_mode: service:gateway
    depends_on:
      gateway: {condition: service_started}
    command: [node, scripts/docker-init.mjs]
    restart: on-failure
  app:
    <<: *app
    network_mode: service:gateway
    depends_on:
      init: {condition: service_completed_successfully}
    command: [npm, run, start, --, --hostname, 0.0.0.0, --port, '3001']
    restart: unless-stopped
volumes:
  database:
  storage:
