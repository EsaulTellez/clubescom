<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2229"/>
      <stop offset="55%" stop-color="#103742"/>
      <stop offset="100%" stop-color="#154c3d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Code panel on left -->
  <rect x="64" y="72" width="450" height="486" rx="18" fill="#07171d" stroke="#2a6b5d" stroke-width="2"/>
  <circle cx="98" cy="106" r="7" fill="#e05a47"/>
  <circle cx="122" cy="106" r="7" fill="#e6b84c"/>
  <circle cx="146" cy="106" r="7" fill="#3db87a"/>
  <text x="176" y="111" fill="#7aa69b" font-family="monospace" font-size="15" font-weight="700">dijkstra_icpc.cpp</text>
  <line x1="64" y1="130" x2="514" y2="130" stroke="#1b463d" stroke-width="1.5"/>
  <text x="92" y="174" fill="#5fd4b3" font-family="monospace" font-size="17">priority_queue&lt;pii, vector&lt;pii&gt;, greater&lt;pii&gt;&gt; pq;</text>
  <text x="92" y="210" fill="#a9d4df" font-family="monospace" font-size="17">dist[src] = 0; pq.push({0, src});</text>
  <text x="92" y="246" fill="#ffd479" font-family="monospace" font-size="17">while (!pq.empty()) {</text>
  <text x="116" y="282" fill="#d9eef3" font-family="monospace" font-size="17">auto [d, u] = pq.top(); pq.pop();</text>
  <text x="116" y="318" fill="#82b8c6" font-family="monospace" font-size="17">if (d &gt; dist[u]) continue;</text>
  <text x="116" y="354" fill="#d9eef3" font-family="monospace" font-size="17">for (auto [v, w] : adj[u]) {</text>
  <text x="140" y="390" fill="#67e8c3" font-family="monospace" font-size="17">if (dist[u] + w &lt; dist[v]) {</text>
  <text x="164" y="426" fill="#ffffff" font-family="monospace" font-size="17">dist[v] = dist[u] + w;</text>
  <text x="164" y="462" fill="#ffffff" font-family="monospace" font-size="17">pq.push({dist[v], v});</text>
  <text x="92" y="514" fill="#5fd4b3" font-family="monospace" font-size="16" font-weight="700">// Complejidad: O((V + E) log V)</text>
  <!-- Graph visualization on right -->
  <g stroke="#3d7682" stroke-width="4" stroke-dasharray="8 6">
    <line x1="650" y1="160" x2="860" y2="120"/>
    <line x1="860" y1="120" x2="1070" y2="230"/>
    <line x1="650" y1="160" x2="710" y2="430"/>
    <line x1="710" y1="430" x2="960" y2="480"/>
  </g>
  <!-- Highlighted shortest path -->
  <g stroke="#38e2b0" stroke-width="6">
    <line x1="650" y1="160" x2="840" y2="300"/>
    <line x1="840" y1="300" x2="1070" y2="230"/>
    <line x1="840" y1="300" x2="960" y2="480"/>
  </g>
  <!-- Edge weight pills -->
  <g font-family="sans-serif" font-size="18" font-weight="800" text-anchor="middle">
    <rect x="720" y="205" width="44" height="30" rx="8" fill="#0b2824" stroke="#38e2b0" stroke-width="2"/>
    <text x="742" y="226" fill="#67f2c9">w=3</text>
    <rect x="935" y="242" width="44" height="30" rx="8" fill="#0b2824" stroke="#38e2b0" stroke-width="2"/>
    <text x="957" y="263" fill="#67f2c9">w=2</text>
    <rect x="880" y="378" width="44" height="30" rx="8" fill="#0b2824" stroke="#38e2b0" stroke-width="2"/>
    <text x="902" y="399" fill="#67f2c9">w=4</text>
    <rect x="740" y="115" width="44" height="30" rx="8" fill="#102c36" stroke="#4f8896" stroke-width="1.5"/>
    <text x="762" y="136" fill="#9bc5d0">w=9</text>
  </g>
  <!-- Nodes -->
  <g font-family="sans-serif" font-weight="900" font-size="24" text-anchor="middle">
    <circle cx="650" cy="160" r="38" fill="#14634f" stroke="#5ef0c4" stroke-width="4"/>
    <text x="650" y="168" fill="#ffffff">S</text>
    <circle cx="860" cy="120" r="34" fill="#143a47" stroke="#6aa5b5" stroke-width="3"/>
    <text x="860" y="128" fill="#d3ecf2">A</text>
    <circle cx="840" cy="300" r="38" fill="#14634f" stroke="#5ef0c4" stroke-width="4"/>
    <text x="840" y="308" fill="#ffffff">B</text>
    <circle cx="710" cy="430" r="34" fill="#143a47" stroke="#6aa5b5" stroke-width="3"/>
    <text x="710" y="438" fill="#d3ecf2">C</text>
    <circle cx="1070" cy="230" r="38" fill="#006699" stroke="#8de4ff" stroke-width="4"/>
    <text x="1070" y="238" fill="#ffffff">T</text>
    <circle cx="960" cy="480" r="36" fill="#14634f" stroke="#5ef0c4" stroke-width="4"/>
    <text x="960" y="488" fill="#ffffff">D</text>
  </g>
</svg>